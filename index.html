<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymAF">
<meta name="theme-color" content="#070B16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>GymAF</title>
<style>
/* Layout idea: night-navy gym app — glowing hero with today's session, stacked lift cards; electric blue = action, deep crimson = the main lift and records */
:root{
  --bg:#070B16; --bg2:#0B1222; --surface:#0F1830; --surface2:#15203E; --line:#21304F;
  --ink:#EAF0FF; --muted:#8C9BC2; --blue:#4C8DFF; --blue2:#2F6BE8; --blue-soft:rgba(76,141,255,.14);
  --red:#E0444F; --red-deep:#8E1B26; --red-soft:rgba(224,68,79,.14); --gold:#F2C46B;
  --tue:#E0444F; --thu:#4C8DFF; --sat:#9DB8FF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(160px + var(--safe-b));min-height:100%;background:
  radial-gradient(700px 420px at 100% -8%,rgba(142,27,38,.38),transparent 62%),
  radial-gradient(800px 500px at -15% 0%,rgba(47,107,232,.22),transparent 60%),var(--bg);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:calc(14px + var(--safe-t)) 0 6px;display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:9px;box-shadow:0 4px 14px -4px rgba(76,141,255,.6)}
.brand{font-weight:900;font-size:21px;letter-spacing:-.5px;margin:0}
.brand span{background:linear-gradient(90deg,var(--blue),#9DB8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr-sub{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;font-weight:600}
.hdr-sub b{color:var(--red)}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;scroll-snap-align:start;min-width:58px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 8px;text-align:center}
.wk b{display:block;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums}
.wk span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.wk.on{background:linear-gradient(160deg,var(--blue),var(--blue2));border-color:transparent;color:#fff;box-shadow:0 8px 20px -10px var(--blue)}
.wk.on span{color:#fff;opacity:.8}
.wk.done:not(.on){border-color:rgba(76,141,255,.55)}
.wk.done b::after{content:"✓";font-size:11px;margin-left:2px;vertical-align:top}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:9px 6px;text-align:center;position:relative;overflow:hidden}
.day b{display:block;font-size:15px;font-weight:800}
.day small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.day::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--dc);opacity:.55}
.day.on{background:var(--surface2);border-color:var(--dc);box-shadow:0 0 0 1px var(--dc) inset,0 10px 24px -12px var(--dc)}
.day.on::before{opacity:1}
.day.done b::after{content:" ✓";color:var(--blue)}
.banner{border-radius:16px;padding:12px 14px;margin:0 0 12px;background:var(--red-soft);border:1px solid rgba(224,68,79,.35);font-size:14px}
.hero{position:relative;border-radius:22px;padding:16px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(150deg,#1B3270 0%,#11204A 50%,#0B1430 100%);border:1px solid rgba(76,141,255,.3)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(224,68,79,.45),transparent 70%)}
.hero .kick{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#FF8A92;font-weight:800;position:relative;z-index:1}
.hero h1{margin:4px 0 2px;font-size:27px;line-height:1.1;font-weight:850;letter-spacing:-.5px;text-wrap:balance;position:relative;z-index:1}
.hero p{margin:4px 0 0;color:#B8C7EC;font-size:13px;position:relative;z-index:1}
.hero-row{display:flex;align-items:center;gap:14px;margin-top:12px;position:relative;z-index:1}
.ring{flex:0 0 64px;height:64px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:850;font-variant-numeric:tabular-nums}
.hero-main{flex:1;min-width:0}
.hero-main small{display:block;color:#93A6D6;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.hero-main strong{font-size:17px;font-weight:850}
.hero-main strong em{font-style:normal;color:#FF8A92}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.card.main{border-color:rgba(224,68,79,.55);background:linear-gradient(180deg,rgba(142,27,38,.32),var(--surface) 100px);box-shadow:0 12px 30px -20px rgba(224,68,79,.8)}
.card.complete{opacity:.6}
.ch{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 28px;height:28px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.card.main .num{background:linear-gradient(160deg,var(--red),var(--red-deep));color:#fff;border-color:transparent}
.card.complete .num{background:var(--blue);color:#fff;border-color:transparent}
.ct{flex:1;min-width:0}
.ct h3{margin:1px 0 0;font-size:16px;font-weight:800;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.pill{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.pill.strong{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:800}
.pill.up{background:var(--blue-soft);color:#8DB6FF;border-color:rgba(76,141,255,.45);font-weight:800}
.big{font-weight:850;font-size:32px;line-height:1;color:var(--red);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-1px}
.big.blue{color:#8DB6FF}
.big.acc{color:var(--ink);font-size:23px}
.big small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0;margin-top:4px;text-transform:uppercase}
.tip{color:var(--muted);font-size:12.5px;margin:9px 0 0}
.last{font-size:12.5px;margin:6px 0 0}
.last em{color:var(--muted);font-style:normal}
.warm{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:12px;align-items:center}
.warm b{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.warm span{background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:3px 7px;font-variant-numeric:tabular-nums;font-weight:600}
.sets{display:grid;gap:7px;margin-top:11px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 54px;gap:7px;align-items:center}
.set label{font-size:12px;color:var(--muted);text-align:center;font-weight:800}
.fld{position:relative}
.fld input{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;background:var(--bg2);color:var(--ink);font:800 18px var(--font);text-align:center;font-variant-numeric:tabular-nums;padding:0 28px 0 6px;-webkit-appearance:none}
.fld input::placeholder{color:#55658C;font-weight:700}
.fld i{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:10.5px;color:var(--muted);font-weight:700}
.ok{height:46px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg2);color:var(--muted);display:grid;place-items:center}
.ok.on{background:linear-gradient(160deg,var(--blue),var(--blue2));border-color:transparent;color:#fff;box-shadow:0 6px 16px -8px var(--blue)}
.set.done .fld input{background:var(--blue-soft);border-color:rgba(76,141,255,.4)}
.section-title{font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:1px;color:var(--muted);margin:20px 4px 8px}
.status{font-size:12px;color:var(--muted);margin:10px 4px 0}
/* calculator */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:4px;margin:12px 0}
.seg button{border:0;background:none;border-radius:12px;padding:10px 4px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:linear-gradient(160deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 16px -10px var(--blue)}
.calc-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc-in label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.calc-in input{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);font:850 24px var(--font);text-align:center;-webkit-appearance:none;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:#BFD5FF}
.res{border-radius:20px;padding:16px;margin:12px 0 10px;background:linear-gradient(150deg,#3A0F17,#1A0A14 60%,#0F1830);border:1px solid rgba(224,68,79,.45);display:flex;align-items:center;gap:12px}
.res small{display:block;color:#E9A4AA;font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.res .v{font-size:46px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
.res .v span{font-size:18px;font-weight:700;color:#E9A4AA;margin-left:4px}
.res .side{margin-left:auto;text-align:right;font-size:12px;color:#C9B3C0}
.res .side b{display:block;color:#fff;font-size:15px}
.flist{display:grid;gap:6px;margin-top:4px}
.frow{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow code{color:var(--muted);font-size:11.5px;font-family:ui-monospace,Menlo,monospace;display:block}
.frow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.frow.off{opacity:.4}
.ptab td:first-child{font-weight:800}
.ptab tr.top td{color:var(--red);font-weight:850}
.ptab td.bar{width:38%}
.ptab td.bar i{display:block;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue2),var(--blue))}
.note{font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
/* timer */
#timer{position:fixed;left:0;right:0;bottom:calc(68px + var(--safe-b));z-index:20;transform:translateY(130%);transition:transform .25s ease}
#timer.show{transform:none}
.tbox{max-width:560px;margin:0 auto 8px;padding:0 12px}
.tin{background:rgba(15,24,48,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(76,141,255,.4);border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.tin.end{background:linear-gradient(160deg,var(--red),var(--red-deep));border-color:transparent;color:#fff}
.tclock{font-size:32px;font-weight:850;font-variant-numeric:tabular-nums;min-width:84px;letter-spacing:-1px}
.tlabel{flex:1;font-size:12px;line-height:1.25;font-weight:600}
.tbtn{border:0;border-radius:11px;padding:9px 10px;font-weight:800;font-size:13px;background:rgba(255,255,255,.1)}
.tin.end .tbtn{background:rgba(0,0,0,.18)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:21;background:rgba(7,11,22,.84);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px 10px}
nav button{border:0;background:none;color:var(--muted);padding:6px 0;border-radius:12px;font-weight:700;font-size:11px}
nav button.on{color:var(--blue)}
nav button svg{display:block;margin:0 auto 3px}
/* forms */
.row{display:grid;grid-template-columns:1fr 132px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{font-weight:700;font-size:14px}
.row label small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.row input{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink);font:800 16px var(--font);text-align:center;width:100%;-webkit-appearance:none}
.btn{border:0;border-radius:14px;background:linear-gradient(160deg,var(--blue),var(--blue2));color:#fff;font-weight:800;padding:13px 14px;font-size:14.5px;width:100%}
.btn.red{background:linear-gradient(160deg,var(--red),var(--red-deep))}
.btn.ghost{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(224,68,79,.45)}
.btns{display:grid;gap:8px;margin-top:10px}
.btns.two{grid-template-columns:1fr 1fr}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink);font:13px ui-monospace,Menlo,monospace;padding:10px;margin-top:8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}
.switch input{width:50px;height:30px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:30px;position:relative;transition:background .2s;flex:0 0 50px}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:var(--blue)}
.switch input:checked::after{transform:translateX(20px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat:nth-child(2) b{color:var(--red)}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
td input{width:76px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink);font:700 14px var(--font);text-align:center;-webkit-appearance:none}
.chart svg{width:100%;height:auto;display:block}
.rules{margin:0;padding-left:18px}
.rules li{margin-bottom:7px;font-size:13.5px}
.rules b{color:var(--red)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (prefers-color-scheme:light){
  :root{--bg:#EEF2FA;--bg2:#F5F7FC;--surface:#FFFFFF;--surface2:#F2F6FF;--line:#D6DEEE;--ink:#0B1430;--muted:#55628A;
    --blue:#1F5FE0;--blue2:#1747B5;--blue-soft:rgba(31,95,224,.1);--red:#A31D2B;--red-deep:#7A1420;--red-soft:rgba(163,29,43,.08);
    --tue:#A31D2B;--thu:#1F5FE0;--sat:#5B7FD6;color-scheme:light}
  body{background:radial-gradient(700px 420px at 100% -8%,rgba(163,29,43,.12),transparent 62%),radial-gradient(800px 500px at -15% 0%,rgba(31,95,224,.12),transparent 60%),var(--bg)}
  .card.main{background:linear-gradient(180deg,rgba(163,29,43,.09),#fff 100px)}
  .pill.up{color:var(--blue)} .big.blue{color:var(--blue)}
  .fld input::placeholder{color:#97A3C2}
  .chip.on{color:var(--blue)}
  nav{background:rgba(255,255,255,.86)}
  .tin{background:rgba(11,20,48,.94);color:#fff}
}

/* ---- GymAF v4 additions ---- */
nav .wrap{grid-template-columns:repeat(5,1fr);padding:6px 6px}
nav button{font-size:10.5px}
.ch .more{flex:0 0 auto;border:1px solid var(--line);background:var(--bg2);border-radius:10px;height:30px;padding:0 9px;font-weight:800;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tool{border:1px solid var(--line);background:var(--bg2);border-radius:11px;padding:7px 10px;font-size:12.5px;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.tool svg{flex:0 0 auto}
.tool.vid{border-color:rgba(224,68,79,.5);background:var(--red-soft)}
.ss-group{border:1.5px dashed rgba(76,141,255,.55);border-radius:24px;padding:8px 6px 0;margin-bottom:10px;position:relative}
.ss-group>.ss-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.8px;color:#8DB6FF;margin:0 8px 8px}
.ss-group .card{margin-bottom:8px}
.pr{display:inline-block;margin-left:4px;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(160deg,var(--red),var(--red-deep));border-radius:6px;padding:1px 5px;vertical-align:middle}
/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.show{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(3,6,14,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + var(--safe-b));box-shadow:0 -20px 50px rgba(0,0,0,.45);max-width:600px;margin:0 auto}
#sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:2px auto 10px}
#sheet h2{margin:0 0 4px;font-size:20px;font-weight:850;letter-spacing:-.3px;text-wrap:balance}
#sheet .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
#sheet .x{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);font-size:16px;font-weight:800}
/* video card */
.vcard{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:linear-gradient(150deg,#1B3270,#3A0F17);border:1px solid rgba(224,68,79,.45);box-shadow:0 14px 30px -18px rgba(224,68,79,.9)}
.vcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;filter:saturate(.8)}
.vcard .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,22,.15),rgba(7,11,22,.85))}
.vcard .play{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:0;background:linear-gradient(160deg,var(--red),var(--red-deep));display:grid;place-items:center;box-shadow:0 10px 30px -6px rgba(224,68,79,.9)}
.vcard .cap{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.vcard .cap b{font-size:15px;line-height:1.2;color:#fff}
.vcard .cap span{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#FF8A92;white-space:nowrap}
.vcard .brand-tag{position:absolute;left:12px;top:10px;font-size:11px;font-weight:900;color:#fff;background:rgba(7,11,22,.55);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:3px 7px;letter-spacing:.3px}
.vcard .brand-tag i{font-style:normal;color:var(--blue)}
.vcard iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlinks{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin:8px 2px 0}
.vlinks a{color:var(--muted);text-decoration:none;font-weight:700}
.cues{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.cues li{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.cues li b{flex:0 0 22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--blue-soft);color:#8DB6FF}
.cues li.warn b{background:var(--red-soft);color:var(--red)}
.mus{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mus span{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;border:1px solid var(--line);color:var(--muted)}
.mus span.p{border-color:rgba(224,68,79,.5);color:#FFB3B8;background:var(--red-soft)}
/* lists in sheets */
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:11px 12px;margin-bottom:7px}
.opt b{display:block;font-size:14.5px}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt .go{margin-left:auto;color:var(--muted);font-weight:900}
.opt.cur{border-color:var(--blue);background:var(--blue-soft)}
.search{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);font:600 15px var(--font);padding:0 14px;margin-bottom:10px;-webkit-appearance:none}
.grp-t{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:14px 2px 7px}
/* plates */
.barviz{display:flex;align-items:center;justify-content:center;gap:2px;height:120px;margin:14px 0 6px}
.barviz .sleeve{width:26px;height:14px;border-radius:3px;background:#8C9BC2}
.barviz .shaft{flex:1;max-width:110px;height:8px;border-radius:3px;background:#5B6A92}
.barviz .collar{width:6px;height:26px;border-radius:2px;background:#C9D3EE}
.plate{width:16px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:900;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg)}
.plist{text-align:center;font-size:15px;font-weight:800}
.plist small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:4px}
/* program editor */
.pe-day{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px}
.pe-day-h{display:flex;align-items:center;gap:8px}
.pe-day-h input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);color:var(--ink);font:800 15px var(--font);padding:0 10px;-webkit-appearance:none}
.dows{display:flex;gap:4px;margin:10px 0}
.dows button{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-weight:800;font-size:12px;color:var(--muted)}
.dows button.on{background:linear-gradient(160deg,var(--blue),var(--blue2));color:#fff;border-color:transparent}
.pe-ex{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.pe-ex .nm{flex:1;min-width:0}
.pe-ex .nm b{display:block;font-size:13.5px;line-height:1.25}
.pe-ex .nm small{color:var(--muted);font-size:11.5px}
.ib{width:32px;height:32px;flex:0 0 32px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--muted)}
.ib.on{border-color:var(--blue);color:#8DB6FF;background:var(--blue-soft)}
.ib.del{color:var(--red)}
.ss-tag{font-size:10px;font-weight:900;color:#8DB6FF;border:1px solid rgba(76,141,255,.5);border-radius:6px;padding:0 4px;margin-left:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label,.fcol label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.fgrid input,.fgrid select,.fcol input,.fcol select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink);font:800 16px var(--font);text-align:center;-webkit-appearance:none}
.fcol{margin-top:10px}
.fcol input{text-align:left;padding:0 12px;font-weight:700}
/* muscle map */
.mmap{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mmap figure{margin:0;text-align:center}
.mmap figcaption{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.mmap svg{width:100%;height:auto;max-height:300px}
.mleg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:8px;justify-content:center}
.mleg i{display:block;width:120px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--surface2),rgba(224,68,79,.45),var(--red))}
.mbar{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.mbar .tr{height:10px;border-radius:10px;background:var(--bg2);position:relative;overflow:hidden;border:1px solid var(--line)}
.mbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:linear-gradient(90deg,var(--blue2),var(--blue))}
.mbar .tr i.hi{background:linear-gradient(90deg,var(--red-deep),var(--red))}
.mbar .tr em{position:absolute;top:-2px;bottom:-2px;border-left:1px dashed var(--muted);opacity:.6}
.mbar b{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,calc(-100% - 60px));z-index:60;transition:transform .3s ease;background:linear-gradient(160deg,var(--red),var(--red-deep));color:#fff;font-weight:850;border-radius:16px;padding:12px 16px;box-shadow:0 14px 30px -10px rgba(224,68,79,.9);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.blue{background:linear-gradient(160deg,var(--blue),var(--blue2));box-shadow:0 14px 30px -10px rgba(76,141,255,.9)}
.finish{margin:6px 0 14px}
.card-img{width:100%;border-radius:16px;border:1px solid var(--line);display:block}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:13px}
.prl .opt{cursor:default}
.prl .opt .go{color:var(--red);font-size:15px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 6px}
/* ---- v5: медиа-карточки ---- */
.xh{display:flex;align-items:center;gap:10px}
.av{flex:0 0 46px;height:46px;border-radius:13px;background:radial-gradient(circle at 50% 30%,#22325E,#0D152B);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.av svg{width:40px;height:40px}
.xh h3{flex:1;min-width:0;margin:0;font-size:16px;font-weight:850;line-height:1.2}
.xh h3 small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.sw{flex:0 0 38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;color:var(--ink)}
.media{position:relative;margin-top:10px;border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:radial-gradient(120% 90% at 50% 20%,#22325E,#0A1022);border:1px solid var(--line);cursor:pointer}
.media .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.15) contrast(1.06) brightness(.98)}
.media .ph.b{animation:gfade 2.6s ease-in-out infinite alternate}
@keyframes gfade{0%,30%{opacity:0}70%,100%{opacity:1}}
.media .tint{position:absolute;inset:0;background:linear-gradient(160deg,#5876C7,#22325E);mix-blend-mode:multiply;opacity:.9}
.media .fadeb{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,22,0) 45%,rgba(7,11,22,.88))}

.media.noimg .ph,.media.noimg .tint{display:none}
.media .chip1{position:absolute;left:10px;bottom:10px;background:rgba(7,11,22,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.media .chip1 b{color:#FF8A92}
.media .focus{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(20,30,60,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:4px 9px 4px 5px;font-size:11.5px;font-weight:850;color:#fff;font-style:italic}
.media .focus svg{width:22px;height:22px}
.media .wt{position:absolute;right:12px;bottom:8px;text-align:right;color:#fff;font-weight:900;font-size:30px;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.media .wt small{display:block;font-size:10.5px;letter-spacing:.6px;color:#FFB3B8;font-weight:800;text-transform:uppercase}
.media .playtag{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:900;color:#fff;background:linear-gradient(160deg,var(--red),var(--red-deep));border-radius:8px;padding:3px 7px;letter-spacing:.3px}
.card.main .media{border-color:rgba(224,68,79,.55)}
.anat-big{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:radial-gradient(circle at 50% 30%,#1A2850,#0B1226);border:1px solid var(--line);border-radius:18px;padding:8px;margin-top:12px}
.anat-big svg{width:100%;height:auto;max-height:230px}
.anat-big figcaption{text-align:center;font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.anat-big figure{margin:0}
.credit{font-size:10.5px;color:var(--muted);margin-top:6px;text-align:right}
@media (prefers-reduced-motion:reduce){.media .ph.b{animation:none;opacity:0}}
/* ---- v6: режим «В зале» ---- */
.startbar{position:sticky;bottom:calc(76px + var(--safe-b));z-index:15;margin:4px 0 12px}
.start-btn{width:100%;height:58px;border:0;border-radius:999px;background:linear-gradient(160deg,var(--red),var(--red-deep));color:#fff;font-weight:900;font-style:italic;font-size:17px;letter-spacing:.5px;box-shadow:0 14px 34px -10px rgba(224,68,79,.9)}
#focus{position:fixed;inset:0;z-index:35;background:var(--bg);display:none;overflow:auto;color:var(--ink)}
#focus.show{display:block}
.fx-media{position:absolute;left:0;right:0;top:0;height:min(52vh,440px);overflow:hidden;background:linear-gradient(170deg,#2B4A9E 0%,#14275E 45%,#3A0F17 100%)}
.fx-media .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fx-media .ph.b{animation:gfade 2.6s ease-in-out infinite alternate}
.fx-media .tint{position:absolute;inset:0;background:linear-gradient(170deg,#5876C7,#22325E 60%,#5A1A24);mix-blend-mode:multiply;opacity:.9}
.fx-media .anat{position:absolute;inset:0;display:none;place-items:center;padding:70px 0 60px}
.fx-media .anat svg{height:100%;width:auto}
.fx-media.noimg .anat{display:grid}.fx-media.noimg .ph,.fx-media.noimg .tint{display:none}
.fx-fade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,rgba(7,11,22,0),var(--bg))}
.fx-top{position:relative;display:flex;align-items:center;gap:10px;padding:calc(14px + var(--safe-t)) 16px 0}
.fx-ib{flex:0 0 42px;width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(7,11,22,.5);display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fx-ib.big{flex:0 0 60px;width:60px;height:60px;border-radius:20px;background:var(--surface);border-color:var(--line)}
.fx-segs{flex:1;display:grid;gap:4px}
.fx-seg{height:6px;border-radius:6px;border:0;padding:0;background:rgba(255,255,255,.25)}
.fx-seg.done{background:#8DB6FF}.fx-seg.on{background:#FF5A65}
.fx-cnt{font-size:13px;font-weight:800;color:#fff}
.fx-tags{position:relative;display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 0}
.fx-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(7,11,22,.55);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:850;font-style:italic;color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fx-tag i{width:8px;height:8px;border-radius:50%;background:#FF5A65}
.fx-tag.red{background:linear-gradient(160deg,var(--red),var(--red-deep));border-color:transparent}
.fx-body{position:relative;padding:calc(min(52vh,440px) - 200px) 16px 130px;max-width:560px;margin:0 auto}
.fx-lbl{font-size:12px;font-weight:850;color:#FF8A92;letter-spacing:1px}
.fx-name{font-size:30px;font-weight:900;font-style:italic;letter-spacing:-.6px;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.fx-steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.fx-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px}
.fx-k{font-size:11px;font-weight:850;color:var(--muted);letter-spacing:.8px}
.fx-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.fx-pm{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);font-size:22px;font-weight:800;color:var(--ink)}
.fx-v{font-size:34px;font-weight:900;font-style:italic;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.fx-strip{display:grid;gap:6px;margin-top:12px}
.fx-st{height:48px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;color:var(--muted);line-height:1.2}
.fx-st.done{background:var(--blue-soft);border-color:rgba(76,141,255,.5);color:var(--ink)}
.fx-st.done span{color:#8DB6FF}
.fx-st.now{background:linear-gradient(160deg,var(--red),var(--red-deep));border-color:transparent;color:#fff;font-weight:900}
.fx-rest{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 12px}
.fx-rest svg{flex:0 0 52px}
.fx-t{font-size:22px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
.fx-ts{font-size:12px;color:var(--muted)}
.fx-bottom{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px calc(16px + var(--safe-b));background:linear-gradient(180deg,rgba(7,11,22,0),var(--bg) 35%);max-width:600px;margin:0 auto}
.fx-go{flex:1;height:60px;border:0;border-radius:20px;background:linear-gradient(160deg,var(--red),var(--red-deep));color:#fff;font-size:17px;font-weight:900;font-style:italic;letter-spacing:.4px;box-shadow:0 14px 34px -10px rgba(224,68,79,.9)}
.fx-done{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:40px 20px;text-align:center;background:radial-gradient(500px 400px at 50% 20%,rgba(224,68,79,.35),transparent 70%)}
.fx-big{font-size:42px;font-weight:900;font-style:italic;letter-spacing:-1px;line-height:1}
.fx-done p{color:var(--muted)}
</style>
</head>

(function(){

/* =====================================================================

const LIB={
 bench:{n:'Жим штанги лёжа',m:['chest'],s:['fdelt','tri'],pat:'hpress',bar:1,max:'bench',v:'nWo_m0REGMA',t:['Лопатки сведены и опущены «в задние карманы» — держи так весь подход.','Стопы твёрдо в полу, давишь ногами «назад к голове», ягодицы на скамье.','Гриф опускается на низ груди, предплечья вертикальны, локти ~45–70° к корпусу.','Вверх гриф идёт немного назад к лицу, по диагонали.','Вдох перед опусканием, держи дыхание до конца повтора.'],w:'Не разводи локти на 90° и не отбивай гриф от груди.'},

/* ---------- ПОМОЩНИКИ ---------- */
const r25=x=>Math.round(x/2.5)*2.5;
const fmt=x=>(Math.round(x*10)/10).toString().replace('.',',');
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const prog=()=>S.progs[S.active];
function presentIn(pr,e,w){if(e.plan)return !!e.plan[w-1];if(e.weeks)return e.weeks.includes(w);return true;}
function restSec(t){const n=(String(t).match(/\d+/g)||['60']).map(Number);const a=n.reduce((x,y)=>x+y,0)/n.length;return /мин/.test(t)?Math.round(a*60):Math.round(a);}
const repTop=r=>Math.max(0,...(String(r).match(/\d+/g)||[]).map(Number));
const repLow=r=>{const n=(String(r).match(/\d+/g)||[]).map(Number);return n.length?Math.min(...n):0;};
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
const exName=e=>e.label||(LIB[e.lib]?LIB[e.lib].n:e.lib);
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOWN=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DCOL={tue:'var(--tue)',thu:'var(--thu)',sat:'var(--sat)'};
const dayColor=(d,i)=>DCOL[d.color]||['var(--red)','var(--blue)','var(--sat)','#F2C46B','#B48CFF','#4FD1C5','#FF8A92'][i%7];
function mon0(pr){const p=(pr.start||'2026-12-01').split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);const dw=(d.getDay()+6)%7;d.setDate(d.getDate()-dw);return d;}
function dateOf(pr,w,day){const d=mon0(pr);d.setDate(d.getDate()+(w-1)*7+day.dow);return d;}
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const dstr=dt=>dt.getDate()+' '+MON[dt.getMonth()];
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
function sortedDays(pr){return pr.days.slice().sort((a,b)=>a.dow-b.dow);}
function autoPick(pr){
  const days=sortedDays(pr);if(!days.length)return{w:1,d:null};
  const start=dateOf(pr,1,days[0]);const t=today();
  if(t<start)return{w:1,d:days[0].id,before:Math.round((start-t)/864e5)};
  const diff=Math.round((t-mon0(pr))/864e5);let w=Math.floor(diff/7)+1;const dw=diff%7;
  let day=days.find(x=>x.dow>=dw);if(!day){w+=1;day=days[0];}
  if(w>pr.weeks)return{w:pr.weeks,d:days[days.length-1].id,after:true};
  return{w,d:day.id};
}
/* план упражнения на неделю */
function exPlan(pr,e,w){
  if(e.plan){const p=e.plan[w-1];if(!p)return null;return{sets:p.s,reps:p.r,pct:p.p};}
  if(!presentIn(pr,e,w))return null;
  let s=+e.sets||3;if((pr.deload||[]).includes(w))s=s>2?Math.max(2,s-1):2;if((pr.taper||[]).includes(w))s=2;
  return{sets:s,reps:e.reps,pct:e.mode==='pct'?(+e.pct||0)/100:null};
}
function maxOf(key){return +(S.settings.max[key]||0);}
function baseKey(e){return e.base||(LIB[e.lib]&&LIB[e.lib].max)||'bench';}
function planW(e,pl){return pl&&pl.pct?r25(maxOf(baseKey(e))*pl.pct):null;}
/* лог */
const LG=(pid)=>{S.log[pid]=S.log[pid]||{};return S.log[pid];};
const dkey=(w,did)=>w+'-'+did;
function getE(pid,w,did,eid){return ((S.log[pid]||{})[dkey(w,did)]||{})[eid]||[];}
function entry(pid,w,did,eid){const L=LG(pid),k=dkey(w,did);L[k]=L[k]||{};L[k][eid]=L[k][eid]||[];return L[k][eid];}
function effLib(pid,w,did,e){const o=((S.over[pid]||{})[dkey(w,did)]||{})[e.id];return o||e.lib;}
function dayList(pr,w,day){return day.ex.map(e=>({e,pl:exPlan(pr,e,w)})).filter(x=>x.pl);}
function dayProgress(pr,w,day){let tot=0,dn=0;dayList(pr,w,day).forEach(({e,pl})=>{tot+=pl.sets;dn+=getE(pr.id,w,day.id,e.id).filter(s=>s&&s.d).length;});return{tot,dn};}
const isDone=(pr,w,day)=>{const p=dayProgress(pr,w,day);return p.tot>0&&p.dn>=p.tot*0.6;};
/* все выполненные подходы (по всем программам) */
function allSets(){const out=[];Object.keys(S.progs).forEach(pid=>{const pr=S.progs[pid];const L=S.log[pid]||{};
  Object.keys(L).forEach(k=>{const [w,did]=[+k.split('-')[0],k.slice(k.indexOf('-')+1)];const day=pr.days.find(x=>x.id===did);if(!day)return;
    Object.keys(L[k]).forEach(eid=>{const e=day.ex.find(x=>x.id===eid);if(!e)return;const lib=effLib(pid,w,did,e);
      (L[k][eid]||[]).forEach((s,si)=>{if(s&&s.d)out.push({pid,w,did,eid,si,lib,wt:+s.w||0,r:+s.r||0,t:s.t||0,pr:!!s.pr,date:dateOf(pr,w,day)});});});});});return out;}
function lastTime(pid,lib,w,did){const pr=S.progs[pid];const order=sortedDays(pr);const curIdx=order.findIndex(x=>x.id===did);
  for(let ww=w;ww>=1;ww--){for(let i=(ww===w?curIdx-1:order.length-1);i>=0;i--){const day=order[i];for(const e of day.ex){if(effLib(pid,ww,day.id,e)!==lib)continue;const L=getE(pid,ww,day.id,e.id).filter(s=>s&&s.d);if(L.length){const pl=exPlan(pr,e,ww);return{w:ww,day,sets:L,reps:pl?pl.reps:e.reps,nsets:pl?pl.sets:e.sets};}}}}return null;}
function bestOf(lib,exclude){let b=0,set=null;allSets().forEach(x=>{if(x.lib!==lib||!x.wt||x.r<1||x.r>12)return;if(exclude&&x.pid===exclude.pid&&x.w===exclude.w&&x.did===exclude.did&&x.eid===exclude.eid&&x.si===exclude.si)return;const v=e1rm(x.wt,x.r);if(v>b){b=v;set=x;}});return{v:b,set};}

function openSheet(html){SHC.innerHTML=html;SH.classList.add('show');SH.querySelector('.pn').scrollTop=0;document.body.style.overflow='hidden';}
function closeSheet(){SH.classList.remove('show');SHC.innerHTML='';document.body.style.overflow='';}
SH.addEventListener('click',ev=>{if(ev.target.classList.contains('bd')||ev.target.closest('.x'))closeSheet();});
function toast(t,blue){const el=document.getElementById('toast');el.textContent=t;el.classList.toggle('blue',!!blue);el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600);}

/* техника + видео */

  const q=encodeURIComponent(L.n+' техника');
  let h=`<div class="grab"></div><button type="button" class="x" aria-label="Закрыть">✕</button><h2>${esc(L.n)}</h2><p class="sub">Как выполнять правильно</p>${media(lib,'',``,true)}`;
  h+='<ul class="cues">'+L.t.map((t,i)=>`<li><b>${i+1}</b><span>${esc(t)}</span></li>`).join('')+(L.w?`<li class="warn"><b>!</b><span>${esc(L.w)}</span></li>`:'')+'</ul>';
  h+=`<div class="anat-big"><figure>${anat(lib,'front')}<figcaption>Спереди</figcaption></figure><figure>${anat(lib,'back')}<figcaption>Сзади</figcaption></figure></div>`;
  h+='<div class="mus">'+L.m.map(k=>`<span class="p">${MUS[k]}</span>`).join('')+L.s.map(k=>`<span>${MUS[k]}</span>`).join('')+'</div>';

      <button type="button" class="play" aria-label="Смотреть видео"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="cap"><b>${esc(L.n)}</b><span>▶ смотреть</span></div></div>
      <div class="vlinks"><a href="https://www.youtube.com/watch?v=${L.v}" target="_blank" rel="noopener">Открыть в YouTube ↗</a><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Другие видео ↗</a></div>`;

function playVideo(){const vc=document.getElementById('vcard');if(!vc||!vc.dataset.v)return;const id=vc.dataset.v;
  vc.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1" title="Видео: техника" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;}

/* замена упражнения */
function swapSheet(eid){const pr=prog(),D=pr.days.find(x=>x.id===cur.d),e=D.ex.find(x=>x.id===eid);if(!e)return;
  const curLib=effLib(pr.id,cur.w,D.id,e),base=LIB[e.lib]||LIB[curLib];const pats=[base.pat].concat(RELATED[base.pat]||[]);
  const cands=Object.keys(LIB).filter(k=>pats.includes(LIB[k].pat));
  let h=`<div class="grab"></div><button type="button" class="x" aria-label="Закрыть">✕</button><h2>Заменить упражнение</h2><p class="sub">Сейчас: ${esc(LIB[curLib].n)}. Тренажёр занят — выбери похожее.</p>
   <div class="seg" style="grid-template-columns:1fr 1fr" id="swap-mode"><button type="button" class="on" data-sm="once">Только сегодня</button><button type="button" data-sm="perm">Насовсем</button></div>`;
  pats.forEach(p=>{const ks=cands.filter(k=>LIB[k].pat===p);if(!ks.length)return;h+=`<div class="grp-t">${PAT[p]}</div>`;
    ks.forEach(k=>{h+=`<button type="button" class="opt${k===curLib?' cur':''}" data-pick="${k}" data-eid="${eid}"><span><b>${esc(LIB[k].n)}</b><small>${LIB[k].m.map(x=>MUS[x]).join(', ')}${LIB[k].v?' · есть видео':''}</small></span><span class="go">${k===curLib?'✓':'›'}</span></button>`;});});
  if(effLib(pr.id,cur.w,D.id,e)!==e.lib)h+=`<button type="button" class="btn ghost" data-unswap="${eid}">Вернуть «${esc(exName(e))}»</button>`;
  openSheet(h);}

/* блины */
function plateMath(target,bar,plates){let side=(target-bar)/2;const out=[];if(side<0)return{out,left:side};const ps=plates.slice().sort((a,b)=>b-a);
  for(const p of ps){while(side>=p-1e-9){out.push(p);side=Math.round((side-p)*100)/100;}}return{out,left:side};}
const PCOL={25:'#C2252D',20:'#2F6BE8',15:'#D9A400',10:'#2E9E6B',5:'#E9EEF9',2.5:'#5B6A92',1.25:'#8C9BC2'};
function plateViz(target){const st=S.settings,res=plateMath(target,st.bar,st.plates);
  const pl=res.out.map(p=>`<div class="plate" style="height:${30+p*3.4}px;background:${PCOL[p]||'#8C9BC2'};color:${p===5?'#0B1430':'#fff'}">${fmt(p)}</div>`).join('');
  let h=`<div class="barviz"><div class="sleeve"></div><div style="display:flex;align-items:center;gap:2px;flex-direction:row-reverse">${pl}</div><div class="collar"></div><div class="shaft"></div><div class="collar"></div><div style="display:flex;align-items:center;gap:2px">${pl}</div><div class="sleeve"></div></div>`;
  if(target<st.bar)h+=`<p class="plist">Вес меньше грифа (${fmt(st.bar)} кг)</p>`;
  else h+=`<p class="plist">${res.out.length?'На каждую сторону: '+res.out.map(fmt).join(' + '):'Только гриф'}<small>Гриф ${fmt(st.bar)} кг · всего ${fmt(st.bar+2*res.out.reduce((a,b)=>a+b,0))} кг${res.left>0.01?` · не хватает ${fmt(res.left*2)} кг — нет мелких блинов`:''}</small></p>`;
  return h;}
function plateSheet(w){const t=w||100;openSheet(`<div class="grab"></div><button type="button" class="x" aria-label="Закрыть">✕</button><h2>Что вешать на гриф</h2><p class="sub">Блины для веса ${fmt(t)} кг</p><div id="pv">${plateViz(t)}</div>
  <div class="fgrid" style="margin-top:12px"><div><label for="pl-w">Вес, кг</label><input id="pl-w" inputmode="decimal" value="${fmt(t)}"></div><div><label>Гриф</label><div class="seg" style="margin:0;grid-template-columns:repeat(3,1fr)">${[20,15,10].map(b=>`<button type="button" data-bar="${b}" class="${S.settings.bar===b?'on':''}">${b}</button>`).join('')}</div></div></div>`);}

let editDay=null;

    <div class="dows">${DOW.map((x,k)=>`<button type="button" class="${d.dow===k?'on':''}" data-ddow="${d.id}" data-k="${k}">${x}</button>`).join('')}</div>
    <div class="fcol" style="margin:0 0 6px"><input value="${esc(d.title||'')}" data-dtitle="${d.id}" placeholder="Описание дня, напр. «Грудь + трицепс»" aria-label="Описание дня"></div>`;
    d.ex.forEach((e,k)=>{const L=LIB[e.lib]||{n:e.lib};const sch=e.plan?'схема по неделям'+(e.base?' · % от '+MAXN[e.base].toLowerCase():''):(e.mode==='pct'?`${e.sets}×${e.reps} · ${e.pct}% ${MAXN[baseKey(e)].toLowerCase()}`:`${e.sets}×${e.reps} · RPE 8`);
      const nx=d.ex[k+1];const linked=e.ss&&nx&&nx.ss===e.ss;
      h+=`<div class="pe-ex"><div class="nm"><b>${esc(exName(e))}${e.ss?`<span class="ss-tag">⛓${esc(e.ss)}</span>`:''}</b><small>${esc(sch)} · ⏱ ${esc(e.rest)}${e.weeks?' · недели '+e.weeks.join(','):''}</small></div>
        <button type="button" class="ib" data-mv="${d.id}|${k}|-1" aria-label="Выше">↑</button><button type="button" class="ib" data-mv="${d.id}|${k}|1" aria-label="Ниже">↓</button>
        ${nx?`<button type="button" class="ib${linked?' on':''}" data-link="${d.id}|${k}" aria-label="Суперсет со следующим">⛓</button>`:'<span class="ib" style="visibility:hidden"></span>'}
        <button type="button" class="ib" data-ed="${d.id}|${e.id}" aria-label="Изменить">✎</button><button type="button" class="ib del" data-exdel="${d.id}|${e.id}" aria-label="Удалить">✕</button></div>`;});
    h+=`<button type="button" class="btn ghost" data-add="${d.id}" style="margin-top:8px">+ Добавить упражнение</button></div>`;});
  h+=`<button type="button" class="btn" id="pg-addday">+ Добавить тренировочный день</button>
  <p class="status">⛓ — объединить упражнение со следующим в суперсет (делаются по очереди без отдыха). ✎ — подходы, повторы, отдых и вес.</p>`;
  V.innerHTML=h;}
function libSheet(did){let h=`<div class="grab"></div><button type="button" class="x" aria-label="Закрыть">✕</button><h2>Добавить упражнение</h2><p class="sub">У каждого есть советы по технике, у большинства — видео</p><input class="search" id="lib-q" data-did="${did}" placeholder="Поиск: жим, бицепс, присед…" autocomplete="off"><div id="lib-list">${libList(did,'')}</div>`;openSheet(h);}
function libList(did,q){q=q.toLowerCase();let h='';Object.keys(PAT).forEach(p=>{const ks=Object.keys(LIB).filter(k=>LIB[k].pat===p&&(!q||LIB[k].n.toLowerCase().includes(q)||PAT[p].toLowerCase().includes(q)||LIB[k].m.some(m=>MUS[m].toLowerCase().includes(q))));if(!ks.length)return;
  h+=`<div class="grp-t">${PAT[p]}</div>`+ks.map(k=>`<button type="button" class="opt" data-addlib="${k}" data-did="${did}"><span><b>${esc(LIB[k].n)}</b><small>${LIB[k].m.map(x=>MUS[x]).join(', ')}${LIB[k].v?' · видео':''}</small></span><span class="go">+</span></button>`).join('');});return h||'<div class="empty">Ничего не найдено</div>';}
const DEF_SCHEME={hpress:[3,'8–10','2–3 мин'],incpress:[3,'8–10','2–3 мин'],vpress:[3,'6–10','2–3 мин'],quad:[3,'8–10','2–3 мин'],hams:[3,'10–12','90 с'],hrow:[3,'10–12','90 с'],vpull:[3,'8–12','90 с']};
function exEditSheet(did,eid){const pr=prog(),d=pr.days.find(x=>x.id===did),e=d.ex.find(x=>x.id===eid);if(!e)return;

  h+=`<div class="fgrid" style="margin-top:10px"><div><label for="xe-rest">Отдых</label><select id="xe-rest">${['60 с','60–90 с','90 с','2 мин','2–3 мин','3–5 мин'].map(r=>`<option${r===e.rest?' selected':''}>${r}</option>`).join('')}${['60 с','60–90 с','90 с','2 мин','2–3 мин','3–5 мин'].includes(e.rest)?'':`<option selected>${esc(e.rest)}</option>`}</select></div><div><label>&nbsp;</label><button type="button" class="btn ghost" data-tech="${e.lib}" style="height:46px;padding:0">${IC.play} Техника</button></div></div>

/* ---------- ПРОГРЕСС ---------- */
function weekVolume(pid,w){const pr=S.progs[pid];let ton=0,sets=0;const mus={};
  pr.days.forEach(day=>{day.ex.forEach(e=>{const lib=effLib(pid,w,day.id,e),L=LIB[lib];getE(pid,w,day.id,e.id).forEach(s=>{if(!s||!s.d)return;sets++;ton+=(+s.w||0)*(+s.r||0);if(L){L.m.forEach(m=>mus[m]=(mus[m]||0)+1);L.s.forEach(m=>mus[m]=(mus[m]||0)+.5);}});});});
  return{ton,sets,mus};}
let volW=null;
function renderProgress(){const pr=prog();
  let h=`<div class="seg four" role="tablist">${[['pr','Рекорды'],['vol','Объём'],['map','Мышцы'],['bench','Жим']].map(([k,n])=>`<button type="button" data-psub="${k}" class="${psub===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(psub==='pr'){const best={};allSets().forEach(x=>{if(!x.wt||x.r<1)return;const v=e1rm(x.wt,Math.min(x.r,12));const b=best[x.lib];if(!b||v>b.v)best[x.lib]={v,x,heavy:Math.max(x.wt,b?b.heavy:0)};else b.heavy=Math.max(b.heavy,x.wt);});
    const keys=Object.keys(best).sort((a,b)=>best[b].v-best[a].v);const prCount=allSets().filter(x=>x.pr).length;
    h+=`<div class="stats"><div class="stat"><b>${keys.length}</b><span>упражнений</span></div><div class="stat"><b>${prCount}</b><span>побито рекордов</span></div><div class="stat"><b>${best.bench?fmt(r25(best.bench.v)):'—'}</b><span>расч. жим</span></div></div><div class="prl">`;
    if(!keys.length)h+='<div class="empty">Рекорды появятся, когда отметишь первые подходы. Новый рекорд подсвечивается красной меткой PR прямо на тренировке.</div>';
    keys.forEach(k=>{const b=best[k];h+=`<div class="opt"><span><b>${esc(LIB[k]?LIB[k].n:k)}</b><small>Лучший подход: ${fmt(b.x.wt)} кг × ${b.x.r} · ${dstr(b.x.date)} · макс. вес ${fmt(b.heavy)} кг</small></span><span class="go">${fmt(Math.round(b.v*10)/10)}</span></div>`;});
    h+='</div><p class="status">Справа — расчётный разовый максимум по лучшему подходу (формула Эпли).</p>';}
  else if(psub==='vol'||psub==='map'){if(volW==null||volW>pr.weeks)volW=Math.min(cur.w,pr.weeks);
    h+='<div class="weeks">';for(let i=1;i<=pr.weeks;i++)h+=`<button type="button" class="wk${i===volW?' on':''}" data-volw="${i}"><b>${i}</b><span>неделя</span></button>`;h+='</div>';
    const V1=weekVolume(pr.id,volW);
    if(psub==='vol'){const all=[];for(let i=1;i<=pr.weeks;i++)all.push(weekVolume(pr.id,i).ton);const mx=Math.max(1,...all);
      h+=`<div class="stats"><div class="stat"><b>${V1.ton>=1000?fmt(Math.round(V1.ton/100)/10)+' т':fmt(V1.ton)}</b><span>тоннаж</span></div><div class="stat"><b>${V1.sets}</b><span>подходов</span></div><div class="stat"><b>${Object.keys(V1.mus).length}</b><span>мышц</span></div></div>
      <div class="card"><h3 style="margin:0 0 8px;font-size:15px">Тоннаж по неделям, т</h3><svg viewBox="0 0 320 130" style="width:100%;height:auto">${all.map((t,i)=>{const bw=(300/pr.weeks)-6,x=14+i*(300/pr.weeks),hh=Math.max(t?3:0,t/mx*92);return `<rect x="${x}" y="${108-hh}" width="${bw}" height="${hh}" rx="5" fill="${i+1===volW?'var(--red)':'var(--blue)'}" opacity="${i+1===volW?1:.7}"/><text x="${x+bw/2}" y="124" font-size="10" text-anchor="middle" fill="var(--muted)">${i+1}</text>${t?`<text x="${x+bw/2}" y="${102-hh}" font-size="9.5" font-weight="700" text-anchor="middle" fill="var(--ink)">${fmt(Math.round(t/100)/10)}</text>`:''}`;}).join('')}</svg>
      <p class="tip">Тоннаж — сумма «вес × повторы» всех отмеченных подходов.</p></div>
      <div class="card"><h3 style="margin:0 0 4px;font-size:15px">Подходы на мышцу · неделя ${volW}</h3><p class="tip" style="margin:0 0 8px">Ориентир для роста — 10–20 подходов в неделю (пунктир — 10). Вспомогательная работа считается за ½.</p>`;
      const order=Object.keys(MUS).filter(k=>V1.mus[k]).sort((a,b)=>V1.mus[b]-V1.mus[a]);
      if(!order.length)h+='<div class="empty">Отметь подходы на этой неделе — здесь появится раскладка по мышцам.</div>';
      order.forEach(k=>{const v=V1.mus[k];h+=`<div class="mbar"><span>${MUS[k]}</span><div class="tr"><i class="${v>=10?'hi':''}" style="width:${Math.min(100,v/20*100)}%"></i><em style="left:50%"></em></div><b>${fmt(v)}</b></div>`;});
      h+='</div>';}
    else{h+=`<div class="card">${muscleMap(V1.mus)}<div class="mleg"><span>0</span><i></i><span>12+ подходов</span></div><p class="tip" style="text-align:center">Неделя ${volW}: чем краснее — тем больше подходов получила мышца.</p></div>`;}}
  else{h+=benchChart(pr);}
  V.innerHTML=h;}
function benchChart(pr){const rows=[];let best=0;
  for(let w=1;w<=pr.weeks;w++){let b=0,top='';pr.days.forEach(day=>day.ex.forEach(e=>{if(effLib(pr.id,w,day.id,e).indexOf('bench')!==0)return;getE(pr.id,w,day.id,e.id).forEach(s=>{if(!s||!s.d)return;const wt=+s.w||0,r=+s.r||1;if(r<1||r>10||!wt)return;const v=e1rm(wt,r);if(v>b){b=v;top=fmt(wt)+'×'+r;}});}));rows.push({w,b,top});if(b>best)best=b;}
  const mx=maxOf('bench'),pts=rows.filter(r=>r.b);
  let h=`<div class="stats"><div class="stat"><b>${best?fmt(r25(best)):'—'}</b><span>расчётный макс.</span></div><div class="stat"><b>${fmt(mx)}</b><span>в настройках</span></div><div class="stat"><b>${best?(best>mx?'+':'')+fmt(Math.round((best-mx)*10)/10):'—'}</b><span>разница</span></div></div><div class="card chart"><h3 style="margin:0 0 8px;font-size:15px">Расчётный максимум в жиме</h3>`;

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return Promise.resolve(true);}

  sortedDays(pr).forEach(d=>{const dt=dateOf(pr,1,d);const ds=dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate())+'T'+p2(t[0])+p2(t[1])+'00';const de=dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate())+'T'+p2((t[0]+1)%24)+p2(t[1])+'00';
    out+=`BEGIN:VEVENT\r\nUID:gymaf-${pr.id}-${d.id}@gymaf\r\nDTSTAMP:${stamp}\r\nDTSTART:${ds}\r\nDTEND:${de}\r\nRRULE:FREQ=WEEKLY;COUNT=${pr.weeks}\r\nSUMMARY:GymAF · ${d.name}: ${(d.title||'тренировка').replace(/[,;]/g,' ')}\r\nDESCRIPTION:Открой GymAF — тренировка дня уже готова\r\nBEGIN:VALARM\r\nTRIGGER:-PT60M\r\nACTION:DISPLAY\r\nDESCRIPTION:Через час тренировка\r\nEND:VALARM\r\nEND:VEVENT\r\n`;});
  return out+'END:VCALENDAR\r\n';}

function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

  if(left<=0){c.textContent='0:00';if(!TIN.classList.contains('end')){TIN.classList.add('end');document.getElementById('tlabel').textContent='Отдых окончен — следующий подход!';beep();try{navigator.vibrate&&navigator.vibrate([250,120,250]);}catch(e){}}return;}

function toggleSet(eid,s,vals){const pr=prog(),D=pr.days.find(x=>x.id===cur.d),w=cur.w;const list=dayList(pr,w,D);const idx=list.findIndex(x=>x.e.id===eid);if(idx<0)return;
  const {e,pl}=list[idx],E=entry(pr.id,w,D.id,eid),lib=effLib(pr.id,w,D.id,e);const v=E[s]||{};v.d=!v.d;
  if(v.d){const wI=document.getElementById(`w-${eid}-${s}`),rI=document.getElementById(`r-${eid}-${s}`);const wv=vals?vals.w:(wI?num(wI.value):null),rv=vals?vals.r:(rI?num(rI.value):null);if(wv!=null)v.w=wv;v.r=rv!=null?rv:repLow(pl.reps);v.t=Date.now();
    const m=S.meta[pr.id]=S.meta[pr.id]||{};const mk=m[dkey(w,D.id)]=m[dkey(w,D.id)]||{};if(!mk.t0)mk.t0=v.t;mk.t1=v.t;
    v.pr=false;if(v.w&&v.r>=1&&v.r<=12){const prev=bestOf(lib,{pid:pr.id,w,did:D.id,eid,si:s});const val=e1rm(v.w,v.r);if(prev.v>0&&val>prev.v+0.01){v.pr=true;}}}
  else v.pr=false;
  E[s]=v;persist();const y=window.scrollY;render();window.scrollTo(0,y);if(FX.open)renderFocus();
  if(v.d){if(v.pr)toast('🏆 Новый рекорд: '+(LIB[lib]||{n:''}).n+' — '+fmt(v.w)+' × '+v.r);
    // суперсет: переход к следующему упражнению без отдыха
    const ss=e.ss;let next=null,lastInGroup=true;if(ss){const nx=list[idx+1];if(nx&&nx.e.ss===ss){next=nx;lastInGroup=false;}}
    const n=E.filter(x=>x&&x.d).length,fin=n>=pl.sets;
    if(next)startTimer(15,'Суперсет → '+(LIB[effLib(pr.id,w,D.id,next.e)]||{n:exName(next.e)}).n);

      startTimer(fin&&!ss?Math.min(rest,120):rest,fin&&!ss?'Упражнение готово! Отдых перед следующим':`Подход ${s+1} из ${pl.sets} · ${exName(e)}`);}

function fCur(){const {pr,D,list}=fList();const it=list[FX.i];if(!it)return null;const lib=effLib(pr.id,cur.w,D.id,it.e);const sets=getE(pr.id,cur.w,D.id,it.e.id);
  let s=0;while(s<it.pl.sets&&sets[s]&&sets[s].d)s++;const pw=planW(it.e,it.pl);const last=pw==null?lastTime(pr.id,lib,cur.w,D.id):null;

    FX.vals[key]={w:v.w!=null?v.w:(prev&&prev.w?+prev.w:(pw!=null?pw:(ls?+ls.w||0:0))),r:v.r!=null?v.r:(prev&&prev.r?+prev.r:repLow(it.pl.reps))};}

  const ss=it.e.ss?list.filter(x=>x.e.ss===it.e.ss).map(x=>(LIB[effLib(pr.id,cur.w,D.id,x.e)]||{n:exName(x.e)}).n):null;
  FEL.innerHTML=`<div class="fx-media">${id?`<img class="ph" src="${IMG}${id}/0.jpg" alt="" onerror="this.parentNode.classList.add('noimg')"><img class="ph b" src="${IMG}${id}/1.jpg" alt="" onerror="this.remove()"><div class="tint"></div>`:''}<div class="anat">${anat(lib)}</div><div class="fx-fade"></div></div>
   <div class="fx-top"><button type="button" class="fx-ib" id="fx-close" aria-label="Выйти из режима тренировки"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="fx-segs" style="grid-template-columns:repeat(${list.length},minmax(0,1fr))">${segs}</div><span class="fx-cnt">${FX.i+1}/${list.length}</span></div>

   <div class="fx-body">
    <div class="fx-lbl">${all?'ВСЕ ПОДХОДЫ ГОТОВЫ':'ПОДХОД '+(s+1)+' ИЗ '+it.pl.sets}${it.pl.pct?' · '+Math.round(it.pl.pct*1000)/10+'%':''} · ${esc(it.pl.reps)} ПОВТ.</div>

    if((el=q('[data-swap]'))){swapSheet(el.dataset.swap);return;}
    if((el=q('[data-plates]'))&&!q('#sheet')){plateSheet(num(el.dataset.plates)||100);return;}
    if(t.id==='share-card'){shareCard();return;}
    if(t.id==='f-start'){openFocus();return;}}
  if((el=q('[data-sm]'))){el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));return;}
  if((el=q('[data-pick]'))){const pr=prog(),D=pr.days.find(x=>x.id===cur.d),e=D.ex.find(x=>x.id===el.dataset.eid);const perm=!!document.querySelector('#swap-mode [data-sm="perm"].on');
    if(perm){e.lib=el.dataset.pick;delete e.label;const o=(S.over[pr.id]||{})[dkey(cur.w,D.id)];if(o)delete o[e.id];}
    else{S.over[pr.id]=S.over[pr.id]||{};const k=dkey(cur.w,D.id);S.over[pr.id][k]=S.over[pr.id][k]||{};if(el.dataset.pick===e.lib)delete S.over[pr.id][k][e.id];else S.over[pr.id][k][e.id]=el.dataset.pick;}
    persist();closeSheet();render();toast(perm?'Заменено в программе':'Заменено на эту тренировку',true);return;}
  if((el=q('[data-unswap]'))){const pr=prog(),o=(S.over[pr.id]||{})[dkey(cur.w,cur.d)];if(o)delete o[el.dataset.unswap];persist();closeSheet();render();return;}
  if((el=q('[data-bar]'))){S.settings.bar=+el.dataset.bar;persist();el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));const w=num((document.getElementById('pl-w')||{}).value)||100;const pv=document.getElementById('pv');if(pv)pv.innerHTML=plateViz(w);return;}
  if((el=q('[data-plate]'))){const p=+el.dataset.plate,a=S.settings.plates;S.settings.plates=a.includes(p)?a.filter(x=>x!==p):a.concat(p);persist();renderTools();return;}
  if((el=q('[data-lift]'))){calcState().lift=el.dataset.lift;persist();renderTools();return;}
  if((el=q('[data-form]'))){const st=calcState()[calcState().lift],k=el.dataset.form;st.f=st.f.includes(k)?st.f.filter(x=>x!==k):st.f.concat(k);persist();renderTools();return;}
  if(t.id==='k-apply'){const v=+t.dataset.v,L=LIFTS[calcState().lift];if(v){S.settings.max[L.set]=v;persist();hdr();t.textContent='✓ Готово: '+fmt(v)+' кг, программа пересчитана';}return;}
  if((el=q('[data-psub]'))){psub=el.dataset.psub;renderProgress();return;}
  if((el=q('[data-volw]'))){volW=+el.dataset.volw;renderProgress();return;}
  // программа
  if((el=q('[data-act]'))){S.active=el.dataset.act;persist();pick=autoPick(prog());cur={w:pick.w,d:pick.d};render();toast('Активная программа: '+prog().name,true);return;}
  if(t.id==='pg-new'){const id=uid('p_');const st=new Date();const dd=(st.getDay()+6)%7;st.setDate(st.getDate()+(7-dd)%7);const p2=n=>String(n).padStart(2,'0');
    S.progs[id]={id,name:'Моя программа',weeks:8,start:st.getFullYear()+'-'+p2(st.getMonth()+1)+'-'+p2(st.getDate()),deload:[],taper:[],days:[{id:uid('d_'),name:'День 1',dow:0,title:'',ex:[]},{id:uid('d_'),name:'День 2',dow:2,title:'',ex:[]},{id:uid('d_'),name:'День 3',dow:4,title:'',ex:[]}]};
    S.active=id;persist();cur={w:1,d:S.progs[id].days[0].id};renderProgram();window.scrollTo(0,0);toast('Создана новая программа',true);return;}
  if(t.id==='pg-dup'){const c=clone(prog());c.id=uid('p_');c.name=c.name+' (копия)';delete c.tmpl;S.progs[c.id]=c;S.active=c.id;persist();renderProgram();toast('Копия создана',true);return;}
  if(t.id==='pg-del'){if(Object.keys(S.progs).length<2){toast('Это единственная программа — сначала создай другую');return;}if(!t.dataset.arm){t.dataset.arm='1';t.textContent='Точно? Нажми ещё раз';setTimeout(()=>{if(t.isConnected){t.dataset.arm='';t.textContent='Удалить программу';}},3500);return;}
    delete S.progs[S.active];delete S.log[S.active];S.active=Object.keys(S.progs)[0];persist();pick=autoPick(prog());cur={w:pick.w,d:pick.d};renderProgram();return;}
  if(t.id==='pg-addday'){const pr=prog();const used=pr.days.map(d=>d.dow);let k=0;while(used.includes(k)&&k<6)k++;pr.days.push({id:uid('d_'),name:'День '+(pr.days.length+1),dow:k,title:'',ex:[]});persist();renderProgram();return;}
  if((el=q('[data-ddel]'))){const pr=prog();if(!el.dataset.arm){el.dataset.arm='1';el.textContent='?';setTimeout(()=>{if(el.isConnected){el.dataset.arm='';el.textContent='✕';}},3000);return;}pr.days=pr.days.filter(d=>d.id!==el.dataset.ddel);persist();renderProgram();return;}
  if((el=q('[data-ddow]'))){const d=prog().days.find(x=>x.id===el.dataset.ddow);d.dow=+el.dataset.k;persist();renderProgram();return;}
  if((el=q('[data-mv]'))){const [did,k,dir]=el.dataset.mv.split('|');const d=prog().days.find(x=>x.id===did);const i=+k,j=i+(+dir);if(j<0||j>=d.ex.length)return;[d.ex[i],d.ex[j]]=[d.ex[j],d.ex[i]];persist();renderProgram();return;}
  if((el=q('[data-link]'))){const [did,k]=el.dataset.link.split('|');const d=prog().days.find(x=>x.id===did);const a=d.ex[+k],b=d.ex[+k+1];if(!b)return;
    if(a.ss&&b.ss===a.ss){b.ss=null;if(!d.ex.some((x,i)=>i!==+k&&x.ss===a.ss))a.ss=null;}
    else{let L=a.ss||b.ss;if(!L){const usedL=new Set(d.ex.map(x=>x.ss).filter(Boolean));L='ABCDEFGH'.split('').find(c=>!usedL.has(c))||'Z';}a.ss=L;b.ss=L;}
    persist();renderProgram();return;}
  if((el=q('[data-exdel]'))){const [did,eid]=el.dataset.exdel.split('|');if(!el.dataset.arm){el.dataset.arm='1';el.textContent='?';setTimeout(()=>{if(el.isConnected){el.dataset.arm='';el.textContent='✕';}},3000);return;}const d=prog().days.find(x=>x.id===did);d.ex=d.ex.filter(x=>x.id!==eid);persist();renderProgram();return;}
  if((el=q('[data-add]'))){libSheet(el.dataset.add);return;}
  if((el=q('[data-addlib]'))){const d=prog().days.find(x=>x.id===el.dataset.did);const k=el.dataset.addlib,L=LIB[k];const ds=DEF_SCHEME[L.pat]||[3,'10–12','60–90 с'];
    d.ex.push({id:uid('e_'),lib:k,sets:ds[0],reps:ds[1],rest:ds[2],tip:'',mode:'rpe',weeks:null});persist();closeSheet();renderProgram();toast('Добавлено: '+L.n,true);return;}
  if((el=q('[data-ed]'))){const [did,eid]=el.dataset.ed.split('|');exEditSheet(did,eid);return;}
  if((el=q('[data-xsave]'))){const [did,eid]=el.dataset.xsave.split('|');const e=prog().days.find(x=>x.id===did).ex.find(x=>x.id===eid);const g=id=>document.getElementById(id);
    if(!e.plan){const s=Math.round(num(g('xe-sets').value)||0);if(s>0&&s<=12)e.sets=s;if(g('xe-reps').value.trim())e.reps=g('xe-reps').value.trim().replace('-','–');e.mode=g('xe-mode').value;if(e.mode==='pct'){e.pct=num(g('xe-pct').value)||75;e.base=g('xe-base').value;}}
    e.rest=g('xe-rest').value;e.tip=g('xe-tip').value.trim();persist();closeSheet();renderProgram();toast('Сохранено',true);return;}
  // настройки
  if(t.id==='ics'){const blob=new Blob([makeICS()],{type:'text/calendar'});shareFile(blob,'gymaf-trenirovki.ics','GymAF · тренировки').then(()=>{const m=document.getElementById('ics-msg');if(m)m.textContent='Открой файл и нажми «Добавить все» — тренировки появятся в Календаре с напоминанием за час.';});return;}
  if(t.id==='exp-file'){shareFile(new Blob([JSON.stringify(S)],{type:'application/json'}),'gymaf-backup-'+new Date().toISOString().slice(0,10)+'.json','Копия GymAF').then(()=>msg('Готово.'));return;}
  if(t.id==='exp-copy'){(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(S)):Promise.reject()).then(()=>msg('Скопировано. Вставь в заметки или Telegram.'),()=>msg('Не получилось скопировать.'));return;}
  if(t.id==='imp-go'){const v=document.getElementById('imp-text').value.trim();if(v)importData(v);else msg('Сначала вставь текст копии.');return;}
  if(t.id==='reset'){if(t.dataset.arm){S.log={};S.meta={};S.over={};S.bw={};persist();t.dataset.arm='';t.textContent='Стереть все отметки';msg('Все отметки стёрты.');}else{t.dataset.arm='1';t.textContent='Точно стереть? Нажми ещё раз';setTimeout(()=>{if(t.isConnected){t.dataset.arm='';t.textContent='Стереть все отметки';}},4000);}return;}
}
V.addEventListener('click',onClick);SHC.addEventListener('click',onClick);
function onInput(ev){const t=ev.target;
  if(t.dataset.f&&t.dataset.e){const pr=prog(),E=entry(pr.id,cur.w,cur.d,t.dataset.e),s=+t.dataset.s;E[s]=E[s]||{};E[s][t.dataset.f]=num(t.value);persist();return;}
  if(t.dataset.bw){const v=num(t.value);if(v==null)delete S.bw[t.dataset.bw];else S.bw[t.dataset.bw]=v;persist();return;}
  if(t.dataset.max){const v=num(t.value);if(v&&v>0){S.settings.max[t.dataset.max]=v;persist();hdr();}return;}
  if(t.id==='k-w'||t.id==='k-r'){const st=calcState()[calcState().lift],v=num(t.value);if(t.id==='k-w')st.w=v;else st.r=v==null?null:Math.round(v);persist();calcOut();return;}
  if(t.id==='pl-w'){const v=num(t.value);if(tab==='tools'&&!SH.classList.contains('show')){S.calc.pw=v;persist();}const pv=document.getElementById('pv');if(pv&&v)pv.innerHTML=plateViz(v);return;}
  if(t.id==='lib-q'){document.getElementById('lib-list').innerHTML=libList(t.dataset.did,t.value);return;}
  if(t.id==='pg-name'){prog().name=t.value||'Программа';persist();hdr();return;}
  if(t.dataset.dname){prog().days.find(x=>x.id===t.dataset.dname).name=t.value||'День';persist();return;}
  if(t.dataset.dtitle){prog().days.find(x=>x.id===t.dataset.dtitle).title=t.value;persist();return;}
}
V.addEventListener('input',onInput);SHC.addEventListener('input',onInput);
V.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='pg-weeks'){const v=Math.round(num(t.value)||0);if(v>=1&&v<=26){prog().weeks=v;persist();renderProgram();}return;}
  if(t.id==='pg-start'&&t.value){prog().start=t.value;persist();pick=autoPick(prog());cur={w:pick.w,d:pick.d};return;}
  if(t.id==='pg-deload'){prog().deload=t.value.split(/[ ,;]+/).map(Number).filter(n=>n>=1&&n<=prog().weeks);persist();return;}
  if(t.id==='set-wake'){S.settings.wake=t.checked;persist();if(!t.checked)releaseAwake();return;}
  if(t.id==='rem-t'){S.settings.remind=t.value;persist();return;}
  if(t.id==='imp-file'&&t.files&&t.files[0]){t.files[0].text().then(importData);}
});

persist();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
